<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆく育 与ダメージ計算機</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2433;--card:#fff;--line:#d9dde5;--acc:#2f6fed;--muted:#6b7385;--off:#f0f1f4}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e6e9f0;--card:#1d2129;--line:#343a47;--acc:#6b9cff;--muted:#98a1b3;--off:#242933}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
main{max-width:980px;margin:0 auto;padding:12px 16px 60px}
section{margin:16px 0}h2{font-size:16px;margin:0 0 8px}h4{margin:14px 0 4px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.card.empty .row{display:flex;gap:10px;align-items:center}
summary{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 14px;margin:10px 0}
label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
input[type=checkbox]{width:18px;height:18px;padding:0}
.tal{display:flex;gap:4px}.tal input{width:25%}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--off);border:1px solid var(--line);margin-left:4px}
.tag.r1{background:var(--acc);color:#fff;border-color:var(--acc)}
.sub{margin:6px 0;border-top:1px dashed var(--line);padding-top:6px}
.skills,.special{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;margin-top:6px}
.sk{flex-direction:row;align-items:center;justify-content:space-between;gap:6px;color:var(--fg)}
.sk.chk{justify-content:flex-start}
.muted{color:var(--muted);font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
.res td:first-child{min-width:150px}
.res td{font-variant-numeric:tabular-nums;font-size:15px}
.note{font-size:11px;color:var(--muted);font-weight:400}
.warn{color:#c0392b}
tr.off td{opacity:.5;background:var(--off)}
table.buf td{text-align:left}table.buf td.nm{width:48%}
.eff{font-size:12px;color:var(--acc)}
.mini{display:inline-flex;flex-direction:row;align-items:center;gap:4px;margin:2px 8px 2px 0}
.mini input{width:70px}
button{cursor:pointer}
</style>
</head>

  const THUNDER_ULT = ['爆雷矢', '雷切', '避雷針', '爆雷閃', '霹靂瞬刃閃', 'n万アンペア', 'レールガン'];
  const BOMB_ATK = ['爆弾変換', '爆弾変換・改', 'きたねぇ花火だぜ'];
  const FOOD_COLS = ['グミ撃ち', 'ビームです', 'ひっかく', 'アイスランス', '貧乏神'];
  const RANGED = ['弓', 'ライフル', 'マシンガン', '杖'];
  const SKILL_FIXED_POWER = { 'デスサイズ': 116, 'ユグドラシルの杖': 116 };
  const ceil = x => Math.ceil(x - 1e-9);

  function build(DATA) {
    const I = { skillBuff: {}, yukuBuff: {}, equipBuff: {}, skillCoef: {}, equipByName: {}, ultCoefByName: {} };
    for (const b of DATA.buffs) {
      const tgt = b.g === 'スキル' ? I.skillBuff : b.g === 'ゆくせさり' ? I.yukuBuff : b.g === '装備' ? I.equipBuff : null;
      if (!tgt) continue;
      const k = b.g === 'ゆくせさり' || b.g === '装備' ? b.n : norm(b.n);
      (tgt[k] = tgt[k] || []).push(b);
    }
    for (const sec of Object.keys(DATA.skillCoef)) for (const e of DATA.skillCoef[sec]) (I.skillCoef[sec + '|' + e.name] = I.skillCoef[sec + '|' + e.name] || []).push(e);
    for (const e of DATA.equipment) (I.equipByName[e.name] = I.equipByName[e.name] || []).push(e);
    for (const sec of ['必殺技', 'スキル', 'サブ必殺技']) for (const e of (DATA.ultCoef[sec] || [])) (I.ultCoefByName[e.name] = I.ultCoefByName[e.name] || []).push(Object.assign({ sec }, e));
    return I;
  }

  function weaponType(DATA, name) {
    const r = (DATA.equipment.find(e => e.name === name) || {});
    return r.type || null;
  }

  // 装備の係数行を選ぶ(習得スキル条件つきの行を優先)
  function pickEquip(DATA, I, name, learned) {
    const rows = I.equipByName[name] || [];
    let best = null, bestN = -1;
    for (const r of rows) {
      const req = [...(r.note || '').matchAll(/『(.+?)』習得時/g)].map(m => norm(m[1]));
      if (req.every(q => learned.has(q)) && req.length > bestN) { best = r; bestN = req.length; }
    }
    return best || rows[0] || null;
  }

  function starOf(DATA, m) {
    const c = DATA.chars[m.char];
    if (!c) return 3;
    let s = c.star;
    const has = n => !!m.skills && Object.keys(m.skills).some(k => norm(k) === norm(n));
    if ((m.char === '魔王姉' || m.char === '魔王妹') && has('ダウングレード')) s = 3;
    if (m.char === '希望' && m.yuku && m.yuku.name === 'リヤルゴのレプリカ') s = 4;
    if (m.char === '貧乏神' && has('弱そうに見える')) s = 1;
    if (m.starOverride) s = m.starOverride;
    return s;
  }

  function learnedSet(DATA, m) {
    const set = new Set(), ranks = {};
    const c = DATA.chars[m.char];
    if (c) for (const k of Object.keys(c.fixed)) { set.add(norm(k)); }
    for (const [k, v] of Object.entries(m.skills || {})) if (v) { set.add(norm(k)); ranks[norm(k)] = v; }
    if (c) for (const [k, rs] of Object.entries(c.fixed)) if (rs.length && !ranks[norm(k)]) ranks[norm(k)] = ROMAN[Math.max(...rs)];
    const sp = m.special || {};
    for (const cat of Object.keys(sp)) if (sp[cat] && typeof sp[cat] === 'string') set.add(norm(sp[cat]));
    if (m.glory) set.add(norm('栄光'));
    return { set, ranks };
  }

  function hasSpecial(m, name) {
    const sp = m.special || {};
    return Object.values(sp).includes(name) || (name === '栄光' && m.glory);
  }

  function isWM(m) { return hasSpecial(m, 'ウェポンマスター'); }

  // ---- バフ項目の収集 -------------------------------------------------
  function defScope(e) {
    const n = e.name;
    if (e.src === 'ult') return 'all';
    if (e.src === 'special') return e.spec.scope || 'self';
    if (n === '自由への翼') return 'persist';
    if (n === '栄光の槍') return 'all';
    if (e.src === 'skill' && /フィールド/.test(n) && !/癒し|リレイズ/.test(n)) return 'all';
    if (n === '剣帝陣') return 'all';
    if (n === '嫌われ者') return 'others';
    return 'self';
  }

  function parseRestrict(note) {
    const r = { only: null, normal: false };
    if (!note) return r;
    if (/通常攻撃の多段hit部分にのみ有効/.test(note)) r.normal = true;
    if (/(にのみ有効|に適用される)/.test(note)) {
      const names = [...note.matchAll(/『(.+?)』/g)].map(m => m[1]);
      if (names.length) r.only = names.map(n => { const m = n.match(/^(.*?)(I{1,3}|IV|V)?$/); return { name: m[1], rank: m[2] || null }; });
    }
    return r;
  }

  function weaponCondOK(note, wtype) {
    if (!note) return true;
    let m;
    if ((m = note.match(/(杖|剣)を装備している場合/))) return wtype === m[1];
    if (/ライフル、マシンガンを装備している場合/.test(note)) return wtype === 'ライフル' || wtype === 'マシンガン';
    if (/遠距離用武器を装備している場合/.test(note)) return RANGED.includes(wtype);
    if (/近距離用武器を装備している場合/.test(note)) return !RANGED.includes(wtype) && wtype !== null;
    return true;
  }

  function xDefault(note) {
    if (!note) return 0;
    let m;
    if ((m = note.match(/x\s*\(\s*(\d+)\s*≧\s*x\s*≧\s*0\s*\)/))) return +m[1];
    if ((m = note.match(/最大値は([\d.]+)/))) return +m[1];
    return 0;
  }

  function collect(DATA, I, state, j) {
    const m = state.party[j];
    const out = [];
    if (!m || !m.char) return out;
    const { set, ranks } = learnedSet(DATA, m);
    const w1 = m.weapon, w2 = m.weapon2;
    const wtype = weaponType(DATA, w1);
    const push = (src, name, rank, b, extra) => {
      const e = Object.assign({ owner: j, src, name, rank, label: name + (rank ? ' ' + rank : ''), note: b && b.note, raw: b || null }, extra || {});
      e.key = [j, src, name, rank || ''].join('|');
      e.scope = defScope(e);
      e.restrict = parseRestrict(b && b.note);
      e.wcond = weaponCondOK(b && b.note, wtype);
      out.push(e);
    };
    // スキル
    for (const key of set) {
      const list = I.skillBuff[key]; if (!list) continue;
      const rk = ranks[key];
      let sel = list;
      if (list.some(b => b.r)) sel = list.filter(b => b.r === rk);
      for (const b of sel) push('skill', b.n, b.r, b);
    }
    // ゆくせさり
    if (m.yuku && m.yuku.name) {
      const list = (I.yukuBuff[m.yuku.name] || []).filter(b => !b.r || String(b.r) === String(m.yuku.rank));
      for (const b of list) push('yuku', b.n, b.r, b);
    }
    // 装備
    for (const w of [w1, w2]) if (w) for (const b of (I.equipBuff[w] || [])) push('equip', b.n, null, b);
    // 特殊習得スキル
    const sp = m.special || {};
    const addSpec = (cat, name) => {
      const spec = ((DATA.special[cat] || {})[name]); if (!spec) return;
      push('special', name, null, null, { spec, note: spec.note });
    };
    for (const cat of Object.keys(DATA.special)) if (sp[cat]) addSpec(cat, sp[cat]);
    if (m.glory) addSpec('レジェンダリー', '栄光');
    // 必殺技バフ
    if (m.ult && m.ult.name && DATA.ultBuff[m.ult.name]) {
      const ub = DATA.ultBuff[m.ult.name];
      let rk = m.ult.rank || 'IV';
      let r = ub.ranks[rk];
      if (ub.byStar) r = null;
      if (r || ub.byStar) push('ult', m.ult.name, ub.byStar ? '(対象の星数)' : rk, null, { ub, rk });
    }
    return out;
  }

  function targetOK(DATA, ub, dealer) {
    const t = ub.target; if (t === 'all') return true;
    const c = DATA.chars[dealer.char] || {};
    const wt = weaponType(DATA, dealer.weapon);
    if (t.food) return !!(c.weapon && c.weapon.food);
    if (t.types) return t.types.includes(wt) || (t.types.includes('刀') && wt === '刀');
    if (t.chars) return t.chars.includes(dealer.char);
    return true;
  }

  // 個別項目の有効状態(既定)
  function entryDefaults(DATA, state, di, e) {
    const dealer = state.party[di];
    const d = { on: true, rate: 1, x: null, variant: 0, scope: e.scope };
    if (e.src === 'ult') { d.on = e.owner !== di && targetOK(DATA, e.ub, dealer); }
    if (!e.wcond) d.on = false;
    if (e.src === 'special' && e.spec.cond && weaponType(DATA, state.party[e.owner].weapon) !== e.spec.cond) d.on = false;
    if (e.raw) { d.x = xDefault(e.raw.note); }
    if (e.raw && e.name === 'エレキフィールド' && hasSpecial(state.party[e.owner], '雷の呼吸')) d.variant = 1;
    if (e.raw && /浮遊石/.test(e.name)) d.variant = 1;
    if (e.src === 'special' && e.spec.perCount) d.x = 0;
    return d;
  }

  function getOv(state, e, d0) { return Object.assign({}, d0, (state.ov || {})[e.key] || {}); }

  function applicableByScope(state, di, e, scope) {
    const role = state.party[e.owner].role;
    const self = e.owner === di;
    if (scope === 'self') return self;
    if (scope === 'all') return self || role === 2 || role === 1;
    if (scope === 'others') return !self && role === 2;
    if (scope === 'persist') return !self && (role === 2 || role === 3);
    return false;
  }

  function attackMatches(e, atk) {
    if (e.restrict.normal && atk && atk.kind !== 'normal') return false;
    if (e.restrict.only && atk) {
      return e.restrict.only.some(o => norm(atk.name).includes(norm(o.name)) && (!o.rank || ROMAN[atk.rankNum] === o.rank));
    }
    if ((e.restrict.only || e.restrict.normal) && !atk) return false;
    return true;
  }

  function resolveValue(v, ov) {
    if (v == null) return 0;
    if (v.v !== undefined) return v.v / 100;
    if (v.x !== undefined) { const x = ov.x == null ? 0 : ov.x; return (v.x || 0) * x / 100; }
    if (v.range) return (v.range[Math.min(ov.variant | 0, v.range.length - 1)]) / 100;
    return 0;
  }

  function newAgg() { return { addAtk: 0, uAdd: 0, isoAtk: 1, indep: 1, uIndep: 1, coefBuf: 1, addVar: 0, isoVar: 1, critRate: 0, critMult: 0, uCritRate: 0, uCritMult: 0, origAtk: 0, origFlat: 0 }; }

  function addTo(A, ch, val, rate) {
    if (!val) return;
    if (MULT.has(ch)) A[ch] *= (1 + val * rate); else A[ch] += val * rate;
  }

  // dealer中心のバフ集計。atk=null ならステータス用(攻撃種別制限のある項目は除外)
  function aggregate(DATA, I, state, di, atk) {
    const A = newAgg(); const used = []; const seenUlt = new Set();
    const dealer = state.party[di];
    const adv = hasSpecial(dealer, '逆境強化') ? 2 : 1;
    const curse = (dealer.yuku && dealer.yuku.name === '怨呪霊千') ? 1.6 : 1;
    let nth = 0;
    for (let j = 0; j < state.party.length; j++) {
      const list = collect(DATA, I, state, j);
      for (const e of list) {
        const d0 = entryDefaults(DATA, state, di, e);
        const ov = getOv(state, e, d0);
        const scopeOK = applicableByScope(state, di, e, ov.scope);
        const usedFlag = scopeOK && ov.on;
        const info = { e, ov, active: usedFlag, scopeOK };
        used.push(info);
        if (!usedFlag) continue;
        if (!attackMatches(e, atk)) { info.skipped = true; continue; }
        const rate = Math.max(0, Math.min(1, +ov.rate));
        if (e.src === 'ult') {
          const ub = e.ub; const key = e.name + '|' + e.rk;
          if (seenUlt.has(key)) { info.dup = true; continue; }
          seenUlt.add(key);
          let r = ub.byStar ? ub.ranks['星' + starOf(DATA, dealer)] : ub.ranks[e.rk];
          if (!r) continue;
          addTo(A, 'addAtk', (r.addAtk || 0) / 100, rate); addTo(A, 'critRate', (r.critRate || 0) / 100, rate); addTo(A, 'critMult', (r.critMult || 0) / 100, rate);
          continue;
        }
        if (e.src === 'special') {
          const s = e.spec; const own = state.party[e.owner];
          if (s.byStar) { addTo(A, 'origAtk', (s.byStar[starOf(DATA, dealer)] || 0) / 100, rate); continue; }
          if (s.orig) addTo(A, 'origAtk', s.orig / 100, rate);
          if (s.addAtk) addTo(A, 'addAtk', s.addAtk / 100, rate);
          if (s.critRate) addTo(A, 'critRate', s.critRate / 100, rate);
          if (s.critMult) addTo(A, 'critMult', s.critMult / 100, rate);
          if (s.perCount) {
            let n = +ov.x || 0; if (s.maxCount) n = Math.min(n, s.maxCount);
            for (const [ch, v] of Object.entries(s.perCount)) {
              let val = v * n; if (ch === 'addAtk' && s.maxVal) val = Math.min(val, s.maxVal);
              addTo(A, ch, val / 100, rate);
            }
          }
          continue;
        }
        // wiki表由来
        let mult = 1;
        if (e.name === '逆境' || e.name === '戦闘狂') mult = adv * (e.owner === di ? curse : 1);
        if (e.name === '戦闘狂の眼帯') mult = 1;
        for (const [col, v] of Object.entries(e.raw.e)) {
          const ch = CH[col]; if (!ch) continue;
          let val = resolveValue(v, ov) * mult;
          addTo(A, ch, val, rate);
        }
      }
    }
    return { A, used };
  }

  // ---- 攻撃一覧 --------------------------------------------------------
  function foodCoef(DATA, value, col) {
    const f = DATA.foodAtk; const ci = f.cols.findIndex(c => c.includes(col));
    if (ci < 0) return null;
    let row = f.rows.find(r => +r[0] === Math.floor(value));
    if (!row) { const lo = f.rows.filter(r => +r[0] <= value); row = lo[lo.length - 1] || f.rows[0]; }
    return +row[ci];
  }

  function buildAttacks(DATA, I, state, di) {
    const m = state.party[di]; const c = DATA.chars[m.char];
    const out = []; if (!c) return out;
    const { set, ranks } = learnedSet(DATA, m);
    const wm = isWM(m);
    const food = c.weapon.food;
    const wname = m.weapon;
    const er = food ? null : pickEquip(DATA, I, wname, set);
    let W = null, ecoef = null;
    if (food) { W = +m.food || 122; }
    else if (er) {
      W = SKILL_FIXED_POWER[wname] || (typeof er.power === 'number' ? er.power : 0);
      if (wm) W = 118;
      ecoef = wm && er.coefWM != null ? er.coefWM : er.coef;
    }
    const thunder = hasSpecial(m, '雷の呼吸'), bomber = hasSpecial(m, '爆弾魔');
    const mk = o => { o.rankNum = o.rankNum || 0; out.push(o); return o; };
    if (!food && er) {
      mk({ id: 'n', label: '通常攻撃', name: '通常攻撃', kind: 'normal', coef: ecoef, W });
      if (set.has(norm('ナイフカウンター'))) mk({ id: 'nc', label: 'ナイフカウンター', name: 'ナイフカウンター', kind: 'normal', coef: ecoef, W, noKami: true });
      if (set.has(norm('カウンターネイル'))) mk({ id: 'cn', label: 'カウンターネイル', name: 'カウンターネイル', kind: 'normal', coef: ecoef, W, noKami: true, pre: 0.5 });
      if (set.has(norm('匠の技'))) mk({ id: 'tk', label: '匠の技', name: '匠の技', kind: 'normal', coef: ecoef, W, noKami: true, pre: 30 });
    }
    if (food) for (const col of FOOD_COLS) {
      if (col === '貧乏神' ? m.char !== '貧乏神' : !set.has(norm(col))) continue;
      const cf = foodCoef(DATA, W, col); if (cf == null) continue;
      mk({ id: 'f' + col, label: col + '（食攻撃力）', name: col, kind: 'skill', coef: cf, W });
    }
    // スキル固有係数
    const skillAtk = (sec, name, label, coefObj) => {
      const lst = I.skillCoef[sec + '|' + name] || [];
      lst.forEach((e, k) => {
        let cf = e.coef;
        if (thunder && THUNDER_COEF[name] != null) cf = THUNDER_COEF[name];
        mk({ id: 'sk' + sec + name + k, label: label || name + (e.note && e.note !== 'なし' ? '（' + e.note + '）' : ''), name, kind: 'skill', coef: cf, W: W != null ? W : 0, note: e.note });
      });
    };
    for (const key of Object.keys(I.skillCoef)) {
      const [sec, name] = key.split('|');
      if (sec === 'スキル' && set.has(norm(name))) skillAtk(sec, name);
      if (sec === 'ゆくせさり' && m.yuku && m.yuku.name && (name === m.yuku.name || name === (m.yuku.name + 'のスーツ'))) skillAtk(sec, name);
      if (sec === '装備' && (name === m.weapon || name === m.weapon2)) skillAtk(sec, name);
      if (sec.startsWith('特殊習得') && m.special && Object.values(m.special).includes(name)) skillAtk(sec, name);
    }
    // 雷神の太鼓
    if (m.yuku && m.yuku.name === '雷神の太鼓') { /* skillCoef/ゆくせさり に含まれる */ }
    // 必殺技
    const pushUlt = (name, rankNum, label, base) => {
      const parts = I.ultCoefByName[name] || [];
      let k = 0;
      for (const e of parts) {
        if (e.sec === 'サブ必殺技' && base !== 'sub') continue;
        let cf = e.coefByRank ? e.coefByRank['ランク' + ROMAN[rankNum]] : e.coef;
        if (cf == null) continue;
        const cond = (e.note || '').match(/『(.+?)』(発動|習得)時/);
        const active = cond ? set.has(norm(cond[1])) : true;
        let lab = label || name;
        if (name === 'n万アンペア') lab = ['', '1万', '10万', '100万', '1000万'][rankNum] + 'アンペア';
        const ne = e.note && e.note !== 'なし' ? '（' + e.note + '）' : '';
        mk({ id: 'u' + name + k++, label: lab + ne, name, kind: 'ult', isUlt: true, coef: cf, W: W != null ? W : 0, rankNum, plus4: name === 'ソウルスティール', inactive: !active, condNote: cond ? cond[0] : null, sub: base === 'sub' });
      }
    };
    if (m.ult && m.ult.name) {
      const rn = ROMAN.indexOf(m.ult.rank || 'IV'); const u = (c.ults.find(x => x.page === m.ult.name) || {}).coef || m.ult.name;
      pushUlt(u, rn > 0 ? rn : 4);
    }
    for (const s of (c.subs || [])) pushUlt(s, 4, s, 'sub');
    // スキル扱いの必殺固有係数(習得スキル名と一致)
    for (const e of (DATA.ultCoef['スキル'] || [])) {
      if (!set.has(norm(e.name))) continue;
      if (out.some(o => o.name === e.name && o.kind === 'ult')) continue;
      mk({ id: 'us' + e.name + e.note, label: e.name + (e.note && e.note !== 'なし' ? '（' + e.note + '）' : ''), name: e.name, kind: 'ult', isUlt: true, coef: e.coef, W: W || 0, rankNum: 4 });
    }
    // ゆくせさり必殺
    if (m.yuku && m.yuku.name) for (const e of (DATA.ultCoef['ゆくせさり'] || [])) {
      if (!e.name.startsWith(m.yuku.name) && !m.yuku.name.startsWith(e.name.replace(/\d+$/, ''))) continue;
      const dg = e.name.match(/(\d)$/);
      if (dg && +dg[1] !== +m.yuku.rank && /セントリーガン/.test(e.name) && !/炸裂/.test(e.name)) continue;
      mk({ id: 'uy' + e.name + e.note, label: e.name + (e.note && e.note !== 'なし' ? '（' + e.note + '）' : ''), name: e.name, kind: 'ult', isUlt: true, coef: e.coef, W: W || 0, rankNum: 4 });
    }
    // 爆弾魔・雷の呼吸 補正フラグ
    for (const a of out) {
      a.extraIso = 1;
      if (bomber && BOMB_ATK.includes(a.name)) a.extraIso *= 3;
      if (thunder && a.kind === 'ult' && THUNDER_ULT.includes(a.name)) a.extraIso *= 1.5;
    }
    return out;
  }

  // ---- ステータス -------------------------------------------------------
  function stats(DATA, I, state, di, aggAll) {
    const m = state.party[di];
    const A = aggAll || aggregate(DATA, I, state, di, null).A;
    let tal = m.tal.slice();
    if (hasSpecial(m, 'アマノジャク') || (m.skills && Object.keys(m.skills).some(k => norm(k) === norm('アマノジャク')))) {
      tal = [(72 / 31) * (31 - tal[0]), 2 * (31 - tal[1]), 2 * (31 - tal[2]), 31 - tal[3]];
    }
    const lv = +m.lv || 1;
    const atk = Math.round(lv * (16 + tal[1]) * 0.1 * (1 + A.origAtk) + A.origFlat);
    return { atk, tal };
  }

  // ---- ダメージ -------------------------------------------------------
  function damage(atkSpec, A, st, g, crit, proc) {
    const achv = 1 + (g.achv || 0);
    const addAtk = Math.max(0, 1 + A.addAtk + (atkSpec.isUlt ? A.uAdd : 0));
    const iso = A.isoAtk;
    const indep = A.indep * (atkSpec.isUlt ? A.uIndep : 1);
    const monQ = +g.yomogi || 0;
    const hasMon = g.mondokoro;
    const kami = g.kami ? ceil((+g.sortie || 0) / 10) : 0;
    const W = atkSpec.W || 0;

    const addVar = 1 + A.addVar;

    let x1, x2, x3;
    if (atkSpec.kind === 'normal') {
      x1 = ceil(((100 + st.atk * addAtk * iso * achv) * indep + mon) * (atkSpec.pre || 1) * atkSpec.coef * A.coefBuf);
      x2 = ceil((x1 + (atkSpec.noKami ? 0 : kami)) * addVar * isoVar * crit);
      return x2 + kusa;
    }
    if (atkSpec.kind === 'skill') {
      x1 = ceil(W * (1 + 0.01 * st.atk * addAtk * iso * achv) * indep + mon);
      x2 = ceil(x1 * atkSpec.coef * A.coefBuf);
      return ceil(x2 * addVar * isoVar * crit) + kusa;
    }
    x1 = ceil(W * (1 + 0.01 * st.atk * addAtk * iso * achv) * indep + mon);
    x2 = ceil(x1 * atkSpec.coef * A.coefBuf + (atkSpec.plus4 ? 4 : 0) + kami);
    return ceil(x2 * addVar * isoVar * crit) + kusa;
  }

  function evaluate(DATA, I, state, di) {
    const g = state.global || {};
    const dealer = state.party[di];
    const attacks = buildAttacks(DATA, I, state, di);
    const aggBase = aggregate(DATA, I, state, di, null);
    const st = stats(DATA, I, state, di, aggBase.A);

    });

<script>/* UI */
(function () {
  'use strict';

  const fmt = n => n == null ? '' : Math.round(n).toLocaleString('ja-JP');

  // ---------- 派生データ ----------
  const yukuNames = (() => {
    const m = {};

  })();
  const yukuOrder = Object.keys(yukuNames);

  const relevantSkill = n => {

  };

  function weaponOptions(m) {
    const c = DATA.chars[m.char]; if (!c || c.weapon.food) return [];
    const have = new Set(Object.keys(m.skills || {}).filter(k => m.skills[k]).map(norm));
    for (const k of Object.keys(c.fixed)) have.add(norm(k));

  }
  function defaultWeapon(m) {

    const pool = opts.length ? opts : weaponOptions(m);

    return pool[0] ? pool[0].name : null;
  }
  function newMember(char, role) {
    const c = DATA.chars[char] || {};

  }

  function specialPanel(i, m) {

  function memberCard(i, m) {

        <label>必殺技 <select data-a="ult" data-i="${i}">${opt('', '—', !(m.ult && m.ult.name))}${ultOpts.map(u => opt(u.page, u.page, m.ult && m.ult.name === u.page)).join('')}</select>

  const CHNAME = { addAtk: '攻撃加算', uAdd: '必殺加算', isoAtk: '攻撃孤立', indep: '独立係数', uIndep: '必殺独立', coefBuf: '係数バフ', addVar: '加算可変', isoVar: '孤立可変', critRate: 'クリ率', critMult: 'クリ倍率', origAtk: '元攻撃力', origFlat: '元攻撃力(±)' };
  function effText(info) {

    if (e.src === 'ult') { const ub = e.ub; const r = ub.byStar ? ub.ranks['星' + E.starOf(DATA, state.party[dealerIdx()] || {})] : ub.ranks[e.rk]; if (r) parts.push(`攻撃+${r.addAtk || 0}%` + (r.critRate ? ` クリ率+${r.critRate}% クリ倍+${r.critMult || 0}%` : '')); }

  function buffPanel(res, di) {

        res.rows.map(r => `<tr class="${r.inactive ? 'off' : ''}"><td>${esc(r.label)}${r.inactive ? `<div class="note">条件未成立: ${esc(r.condNote)}</div>` : ''}<div class="note">係数${r.coef} / 武器攻撃力${r.W == null ? '-' : r.W} / クリ率${(r.R * 100).toFixed(1)}% 倍率+${(r.M * 100).toFixed(0)}%</div></td><td>${fmt(r.normal)}</td><td>${fmt(r.crit)}</td><td>${fmt(r.expect)}</td>${waki ? `<td>${fmt(r.critProc)}</td>` : ''}</tr>`).join('') + '</tbody></table></div>';
      if (!res.rows.length) h += '<p class="muted">計算できる攻撃がありません（武器・必殺技・スキルを選んでください）。</p>';
      h += '</section><section><h2>適用中のバフ</h2><p class="muted">チェックで有効/無効、発動率(0〜1)、適用範囲を変更できます。条件つきのスキル（逆境・HP条件など）は発動率で調整してください。</p>' + buffPanel(res, di);
    }
    h += '</section>';
    $('#app').innerHTML = h;
    save();
  }

  // ---------- イベント ----------
  function onChange(ev) {
    const t = ev.target; const a = t.dataset.a; if (!a) return;
    const i = +t.dataset.i; const m = state.party[i];
    const val = t.type === 'checkbox' ? t.checked : t.value;
    switch (a) {
      case 'char':
        if (!val) state.party[i] = { char: '', role: 2 };
        else { const role = m && m.char ? m.role : (dealerIdx() < 0 ? 1 : 2); state.party[i] = newMember(val, role); state.open[i] = true; }
        break;
      case 'role':
        if (+val === 1) state.party.forEach((x, k) => { if (x.char && x.role === 1 && k !== i) x.role = 2; });
        m.role = +val; break;
      case 'set': {
        const f = t.dataset.f;
        if (/^tal\d$/.test(f)) m.tal[+f[3]] = +val;
        else if (f === 'weapon') { m.weapon = val; }
        else if (f === 'weapon2') m.weapon2 = val || null;
        else m[f] = +val;
        break;
      }
      case 'skill': {
        const n = t.dataset.n; m.skills = m.skills || {};
        if (t.type === 'checkbox') m.skills[n] = val ? true : undefined; else m.skills[n] = val || undefined;
        if (!weaponOptions(m).some(e => e.name === m.weapon)) m.weapon = defaultWeapon(m);
        break;
      }
      case 'spec': m.special = m.special || {}; m.special[t.dataset.cat] = val || undefined;
        if (!weaponOptions(m).length) break; break;
      case 'glory': m.glory = !!val; break;
      case 'yuku': m.yuku = val ? { name: val, rank: [...(yukuNames[val] || [])].sort((a, b) => +a - +b).pop() || 1 } : null; break;
      case 'yukurank': m.yuku.rank = val; break;
      case 'ult': m.ult = val ? { name: val, rank: 'IV' } : null; break;
      case 'ultrank': if (m.ult) m.ult.rank = val; break;
      case 'g': { const f = t.dataset.f; state.global[f] = f === 'achv' ? (+val) / 100 : +val; break; }
      case 'ov': {
        const k = t.dataset.k; const f = t.dataset.f; state.ov[k] = state.ov[k] || {};
        state.ov[k][f] = f === 'on' ? !!val : (f === 'scope' ? val : +val); break;
      }
    }
    render();
  }
  document.addEventListener('change', onChange);
  document.addEventListener('toggle', ev => { const d = ev.target; if (d.tagName === 'DETAILS' && d.dataset.i != null) { state.open[d.dataset.i] = d.open; save(); } }, true);
  $('#reset').addEventListener('click', () => { if (confirm('入力内容を初期化しますか？')) { initState(); render(); } });
  render();
})();
</script>
</body>
</html>
