<script>/* ゆく育 与ダメージ計算エンジン (純粋関数。ブラウザ/Node両対応) */
(function (root) {
  'use strict';
  const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI'];
  const ALIAS = { 'テルプシコレー': 'テレプシコレー', 'デバフ要員lm': 'デバフ要員' };
  const norm = s => {
    let t = (s || '').normalize('NFKC').toLowerCase().replace(/[!♡\s?]/g, '');
    return ALIAS[t] || t;
  };
  const CH = {
    'クリティカル.発生率': 'critRate', 'クリティカル発生率': 'critRate',
    'クリティカル.倍率': 'critMult', 'クリティカル倍率': 'critMult',
    '必殺クリティカル.発生率': 'uCritRate', '必殺クリティカル.倍率': 'uCritMult',
    '攻撃加算バフ(%)': 'addAtk', '必殺加算バフ(%)': 'uAdd', '攻撃孤立バフ': 'isoAtk',
    '独立係数': 'indep', '必殺独立係数': 'uIndep', '係数バフ': 'coefBuf',
    '加算可変係数': 'addVar', '孤立可変係数': 'isoVar',
    '元攻撃力バフ(%)': 'origAtk', '元攻撃力バフ': 'origAtk', '元攻撃力バフ(±)': 'origFlat'
  };
  const MULT = new Set(['isoAtk', 'indep', 'uIndep', 'coefBuf', 'isoVar']);
  const THUNDER_COEF = { '雷帝': 0.15, '雷神': 0.1, '静電気': 0.18, '雷撃カウンター': 0.05, '雷神の太鼓': 0.15 };
  const THUNDER_ULT = ['爆雷矢', '雷切', '避雷針', '爆雷閃', '霹靂瞬刃閃', 'n万アンペア', 'レールガン'];
  const BOMB_ATK = ['爆弾変換', '爆弾変換・改', 'きたねぇ花火だぜ'];
  const FOOD_COLS = ['グミ撃ち', 'ビームです', 'ひっかく', 'アイスランス', '貧乏神'];
  const RANGED = ['弓', 'ライフル', 'マシンガン', '杖'];
  const SKILL_FIXED_POWER = { 'デスサイズ': 116, 'ユグドラシルの杖': 116 };
  const ceil = x => Math.ceil(x - 1e-9);

  function build(DATA) {
    const I = { skillBuff: {}, yukuBuff: {}, equipBuff: {}, skillCoef: {}, equipByName: {}, ultCoefByName: {} };
    for (const b of DATA.buffs) {
      const tgt = b.g === 'スキル' ? I.skillBuff : b.g === 'ゆくせさり' ? I.yukuBuff : b.g === '装備' ? I.equipBuff : null;
      if (!tgt) continue;
      const k = b.g === 'ゆくせさり' || b.g === '装備' ? b.n : norm(b.n);
      (tgt[k] = tgt[k] || []).push(b);
    }
    for (const sec of Object.keys(DATA.skillCoef)) for (const e of DATA.skillCoef[sec]) (I.skillCoef[sec + '|' + e.name] = I.skillCoef[sec + '|' + e.name] || []).push(e);
    for (const e of DATA.equipment) (I.equipByName[e.name] = I.equipByName[e.name] || []).push(e);
    for (const sec of ['必殺技', 'スキル', 'サブ必殺技']) for (const e of (DATA.ultCoef[sec] || [])) (I.ultCoefByName[e.name] = I.ultCoefByName[e.name] || []).push(Object.assign({ sec }, e));
    return I;
  }

  function weaponType(DATA, name) {
    const r = (DATA.equipment.find(e => e.name === name) || {});
    return r.type || null;
  }

  // 装備の係数行を選ぶ(習得スキル条件つきの行を優先)
  function pickEquip(DATA, I, name, learned) {
    const rows = I.equipByName[name] || [];
    let best = null, bestN = -1;
    for (const r of rows) {
      const req = [...(r.note || '').matchAll(/『(.+?)』習得時/g)].map(m => norm(m[1]));
      if (req.every(q => learned.has(q)) && req.length > bestN) { best = r; bestN = req.length; }
    }
    return best || rows[0] || null;
  }

  function starOf(DATA, m) {
    const c = DATA.chars[m.char];
    if (!c) return 3;
    let s = c.star;
    const has = n => learnedSet(DATA, m).set.has(norm(n));
    if ((m.char === '魔王姉' || m.char === '魔王妹') && has('ダウングレード')) s = 3;
    if (m.char === '希望' && m.yuku && m.yuku.name === 'リヤルゴのレプリカ') s = 4;
    if (m.char === '貧乏神' && has('弱そうに見える')) s = 1;
    if (m.starOverride) s = m.starOverride;
    return s;
  }

  function learnedSet(DATA, m) {
    const set = new Set(), ranks = {};
    const c = DATA.chars[m.char];
    if (c) for (const [k, rs] of Object.entries(c.fixed)) { set.add(norm(k)); if (rs.length) ranks[norm(k)] = rs.map(r => ROMAN[r]); }
    for (const [k, v] of Object.entries(m.skills || {})) {
      if (!v) continue; const nk = norm(k);
      if (Array.isArray(v)) { if (!v.length) continue; set.add(nk); ranks[nk] = [...new Set([...(ranks[nk] || []), ...v])]; }
      else set.add(nk);
    }
    const sp = m.special || {};
    for (const cat of Object.keys(sp)) if (sp[cat] && typeof sp[cat] === 'string') set.add(norm(sp[cat]));
    if (m.glory) set.add(norm('栄光'));
    return { set, ranks };
  }

  function hasSpecial(m, name) {
    const sp = m.special || {};
    return Object.values(sp).includes(name) || (name === '栄光' && m.glory);
  }

  function isWM(m) { return hasSpecial(m, 'ウェポンマスター'); }

  // ---- バフ項目の収集 -------------------------------------------------
  function defScope(e) {
    const n = e.name;
    if (e.owner > 0) return 'all';
    if (e.src === 'ult') return 'all';
    if (e.src === 'special') return e.spec.scope || 'self';
    if (n === '自由への翼') return 'persist';
    if (n === '栄光の槍') return 'all';
    if (e.src === 'skill' && /フィールド/.test(n) && !/癒し|リレイズ/.test(n)) return 'all';
    if (n === '剣帝陣' || n === '鼓舞' || n === 'カリスマ') return 'all';
    if (n === '嫌われ者') return 'others';
    return 'self';
  }

  function parseRestrict(note) {
    const r = { only: null, normal: false };
    if (!note) return r;
    if (/通常攻撃の多段hit部分にのみ有効/.test(note)) r.normal = true;
    if (/(にのみ有効|に適用される)/.test(note)) {
      const names = [...note.matchAll(/『(.+?)』/g)].map(m => m[1]);
      if (names.length) r.only = names.map(n => { const m = n.match(/^(.*?)(I{1,3}|IV|V)?$/); return { name: m[1], rank: m[2] || null }; });
    }
    return r;
  }

  function weaponCondOK(note, wtype) {
    if (!note) return true;
    let m;
    if ((m = note.match(/(杖|剣)を装備している場合/))) return wtype === m[1];
    if (/ライフル、マシンガンを装備している場合/.test(note)) return wtype === 'ライフル' || wtype === 'マシンガン';
    if (/遠距離用武器を装備している場合/.test(note)) return RANGED.includes(wtype);
    if (/近距離用武器を装備している場合/.test(note)) return !RANGED.includes(wtype) && wtype !== null;
    return true;
  }

  function xDefault(note) {
    if (!note) return 0;
    let m;
    if ((m = note.match(/x\s*\(\s*(\d+)\s*≧\s*x\s*≧\s*0\s*\)/))) return +m[1];
    if ((m = note.match(/最大値は([\d.]+)/))) return +m[1];
    return 0;
  }

  function collect(DATA, I, state, j) {
    const m = state.party[j];
    const out = [];
    if (!m || !m.char) return out;
    const { set, ranks } = learnedSet(DATA, m);
    const w1 = m.weapon, w2 = m.weapon2;
    const wtype = weaponType(DATA, w1);
    const push = (src, name, rank, b, extra) => {
      const e = Object.assign({ owner: j, src, name, rank, label: name + (rank ? ' ' + rank : ''), note: b && b.note, raw: b || null }, extra || {});
      e.key = [j, src, name, rank || ''].join('|');
      e.scope = defScope(e);
      e.restrict = parseRestrict(b && b.note);
      e.wcond = weaponCondOK(b && b.note, wtype);
      out.push(e);
    };
    // スキル
    for (const key of set) {
      if (key === norm('威嚇')) continue;
      const list = I.skillBuff[key]; if (!list) continue;
      const rk = ranks[key];
      let sel = list;
      if (list.some(b => b.r)) sel = list.filter(b => rk && rk.includes(b.r));
      for (const b of sel) push('skill', b.n, b.r, b);
    }
    // ゆくせさり
    if (m.yuku && m.yuku.name) {
      const list = (I.yukuBuff[m.yuku.name] || []).filter(b => !b.r || String(b.r) === String(m.yuku.rank));
      for (const b of list) push('yuku', b.n, b.r, b);
    }
    // 装備
    for (const w of [w1, w2]) if (w) for (const b of (I.equipBuff[w] || [])) push('equip', b.n, null, b);
    if (w1 === '焙烙玉') push('equip', '焙烙玉の武器攻撃力強化', null, { n: '焙烙玉の武器攻撃力強化', e: {}, note: '武器攻撃力125（OFFで101）' });
    // 特殊習得スキル
    const sp = m.special || {};
    const addSpec = (cat, name) => {
      const spec = ((DATA.special[cat] || {})[name]); if (!spec) return;
      push('special', name, null, null, { spec, note: spec.note });
    };
    for (const cat of Object.keys(DATA.special)) if (sp[cat]) addSpec(cat, sp[cat]);
    if (m.glory) addSpec('レジェンダリー', '栄光');
    // 必殺技バフ
    if (m.ult && m.ult.name && DATA.ultBuff[m.ult.name]) {
      const ub = DATA.ultBuff[m.ult.name];
      let rk = m.ult.rank || 'IV';
      let r = ub.ranks[rk];
      if (ub.byStar) r = null;
      if (r || ub.byStar) push('ult', m.ult.name, ub.byStar ? '(対象の星数)' : rk, null, { ub, rk });
    }
    if (m.debuffs) for (const d of m.debuffs) push('debuff', d.name, null, { n: d.name, e: { '加算可変係数': { v: d.v } }, note: d.note || 'デバフ（敵の被ダメージ増加）' });
    // 必殺技ごとの自己バフ(入力値つき)
    if (m.ult && m.ult.name) {
      const un = m.ult.name;
      const mkSelf = (name, e2, note) => push('ultself', name, null, { n: name, e: e2, note });
      if (un === '妖術・つむじ風') mkSelf('つむじ風：戦闘不能者数', { '孤立可変係数': { x: 50, raw: '+50x %' } }, 'x=戦闘不能状態の味方ゆっくりの数（1体ごとにダメージ+50%）。『妖術・つむじ風』にのみ有効');
      if (un === '魔剣リヤルゴ') mkSelf('魔剣リヤルゴ：味方を倒した数', { '攻撃加算バフ(%)': { x: 10, cap: 100, raw: '+10x %（最大100%）' } }, 'x=味方を倒した数（最大値は10）。1体ごとに攻撃・防御の加算バフ+10%、100%で頭打ち');
      if (un === '皆殺しの舞') {
        mkSelf('皆殺しの舞：敵撃破ごとのバフ', { '攻撃加算バフ(%)': { x: 0.1, cap: 200, raw: '+0.1x %（最大200%）' } }, 'x=敵撃破数（最大値は2000）。1体ごとに攻撃加算+0.1%、上限200%');
        mkSelf('皆殺しの舞：発狂モード', { '攻撃加算バフ(%)': { v: 50 }, 'クリティカル.発生率': { v: 1.5 }, 'クリティカル.倍率': { v: 30 } }, '発狂モードが有効のとき（スキル『発狂モード』のチェックに連動）');
        mkSelf('皆殺しの舞：生存している味方が自分のみ', { '攻撃加算バフ(%)': { v: 50 }, 'クリティカル.発生率': { v: 1.5 }, 'クリティカル.倍率': { v: 30 } }, '生存している味方が自分のみのとき（発狂モードと併用で両方が加算）');
      }
    }
    return out;
  }

  function targetOK(DATA, ub, dealer) {
    const t = ub.target; if (t === 'all') return true;
    const c = DATA.chars[dealer.char] || {};
    const wt = weaponType(DATA, dealer.weapon);
    if (t.food) return !!(c.weapon && c.weapon.food);
    if (t.types) return t.types.includes(wt) || (t.types.includes('刀') && wt === '刀');
    if (t.chars) return t.chars.includes(dealer.char);
    return true;
  }

  // 個別項目の有効状態(既定)
  function entryDefaults(DATA, state, di, e) {
    const dealer = state.party[di];
    const d = { on: true, rate: 1, x: null, variant: 0, scope: e.scope };
    if (e.src === 'ult') { d.on = e.owner !== di || e.name === '盗賊の心得'; }
    if (e.src === 'skill' && e.name === '一方的なライバル意識') d.on = false;
    if (e.src === 'skill' && e.name === '爆発娘の眼帯が好き') { const ow = state.party[e.owner]; d.on = !!(ow.yuku && ow.yuku.name === '爆発娘の眼帯'); }
    if (e.src === 'skill' && e.name === '頑固者') { const ow = state.party[e.owner]; if (ow.yuku && ow.yuku.name === '鍛冶屋の眼帯') d.on = false; }
    if (e.src === 'skill' && /不器用/.test(e.name)) { const ow = state.party[e.owner]; if (ow.yuku && ow.yuku.name === 'ランク6ユックライト') d.on = false; }
    if (e.name === '皆殺しの舞：発狂モード') d.on = learnedSet(DATA, dealer).set.has(norm('発狂モード'));
    if (e.name === '皆殺しの舞：生存している味方が自分のみ') d.on = false;
    if (!e.wcond) d.on = false;
    if (e.src === 'equip' && e.name === '蒼紅') d.on = false;
    if (e.src === 'skill' && norm(e.name) === norm('同族嫌悪')) {
      const own = state.party[e.owner];
      d.on = state.party.some((x, k) => k !== e.owner && x.char === own.char && (x.role === 1 || x.role === 2));
    }
    if (e.src === 'special' && e.spec.cond && weaponType(DATA, state.party[e.owner].weapon) !== e.spec.cond) d.on = false;
    if (e.raw) { d.x = xDefault(e.raw.note); }
    if (e.raw && e.name === 'エレキフィールド' && hasSpecial(state.party[e.owner], '雷の呼吸')) d.variant = 1;
    if (e.raw && /浮遊石/.test(e.name)) d.variant = 1;
    if (e.src === 'special' && e.spec.perCount) d.x = e.spec.defCount || 0;
    return d;
  }

  function getOv(state, e, d0) { return Object.assign({}, d0, (state.ov || {})[e.key] || {}); }

  function applicableByScope(state, di, e, scope) {
    const role = state.party[e.owner].role;
    const self = e.owner === di;
    if (scope === 'self') return self;
    if (scope === 'all') return self || role === 2 || role === 1;
    if (scope === 'others') return !self && role === 2;
    if (scope === 'persist') return !self && (role === 2 || role === 3);
    return false;
  }

  function attackMatches(e, atk) {
    if (e.restrict.normal && atk && atk.kind !== 'normal') return false;
    if (e.restrict.only && atk) {
      return e.restrict.only.some(o => norm(atk.name).includes(norm(o.name)) && (!o.rank || ROMAN[atk.rankNum] === o.rank));
    }
    if ((e.restrict.only || e.restrict.normal) && !atk) return false;
    return true;
  }

  function resolveValue(v, ov) {
    if (v == null) return 0;
    if (v.v !== undefined) return v.v / 100;
    if (v.x !== undefined) { const x = ov.x == null ? 0 : ov.x; return (v.x || 0) * x / 100; }
    if (v.range) return (v.range[Math.min(ov.variant | 0, v.range.length - 1)]) / 100;
    return 0;
  }

  const DEDUP = ['同調圧力', 'みんな違ってみんないい', 'ジェネラルの眼帯'];
  function newAgg() { return { addAtk: 0, uAdd: 0, isoAtk: 1, indep: 1, uIndep: 1, coefBuf: 1, addVar: 0, isoVar: 1, critRate: 0, critMult: 0, uCritRate: 0, uCritMult: 0, origAtk: 0, origFlat: 0 }; }

  function addTo(A, ch, val, rate) {
    if (!val) return;
    if (MULT.has(ch)) A[ch] *= (1 + val * rate); else A[ch] += val * rate;
  }

  // dealer中心のバフ集計。atk=null ならステータス用(攻撃種別制限のある項目は除外)
  function aggregate(DATA, I, state, di, atk, opts) {
    const A = newAgg(); const used = []; const seenUlt = new Set(); const seenNamed = new Set();
    const dealer = state.party[di];
    const dstar = (opts && opts.star) || starOf(DATA, dealer);
    const adv = hasSpecial(dealer, '逆境強化') ? 2 : 1;
    const curse = (dealer.yuku && dealer.yuku.name === '怨呪霊千') ? 1.6 : 1;
    let nth = 0;
    for (let j = 0; j < state.party.length; j++) {
      const list = collect(DATA, I, state, j);
      for (const e of list) {
        const d0 = entryDefaults(DATA, state, di, e);
        const ov = getOv(state, e, d0);
        const scopeOK = applicableByScope(state, di, e, ov.scope);
        const usedFlag = scopeOK && ov.on;
        const info = { e, ov, active: usedFlag, scopeOK };
        used.push(info);
        if (!usedFlag) continue;
        if (opts && opts.little && ov.scope === 'self') { info.skipped = true; continue; }
        if (!attackMatches(e, atk)) { info.skipped = true; continue; }
        if (DEDUP.includes(e.name)) { if (seenNamed.has(e.name)) { info.dup = true; continue; } seenNamed.add(e.name); }
        const rate = Math.max(0, Math.min(1, +ov.rate));
        if (e.src === 'ult') {
          const ub = e.ub; const key = e.name + '|' + e.rk;
          if (seenUlt.has(key)) { info.dup = true; continue; }
          seenUlt.add(key);
          let r = ub.byStar ? ub.ranks['星' + dstar] : ub.ranks[e.rk];
          if (!r) continue;
          addTo(A, 'addAtk', (r.addAtk || 0) / 100, rate); addTo(A, 'critRate', (r.critRate || 0) / 100, rate); addTo(A, 'critMult', (r.critMult || 0) / 100, rate);
          continue;
        }
        if (e.src === 'special') {
          const s = e.spec; const own = state.party[e.owner];
          if (s.byStar) { addTo(A, 'origAtk', (s.byStar[dstar] || 0) / 100, rate); continue; }
          if (s.orig) addTo(A, 'origAtk', s.orig / 100, rate);
          if (s.addAtk) addTo(A, 'addAtk', s.addAtk / 100, rate);
          if (s.critRate) addTo(A, 'critRate', s.critRate / 100, rate);
          if (s.critMult) addTo(A, 'critMult', s.critMult / 100, rate);
          if (s.perCount) {
            let n = +ov.x || 0; if (s.maxCount) n = Math.min(n, s.maxCount);
            for (const [ch, v] of Object.entries(s.perCount)) {
              let val = v * n; if (ch === 'addAtk' && s.maxVal) val = Math.min(val, s.maxVal);
              addTo(A, ch, val / 100, rate);
            }
          }
          continue;
        }
        // wiki表由来
        let mult = 1;
        if (e.name === '逆境' || e.name === '戦闘狂') mult = adv * (e.owner === di ? curse : 1);
        if (e.name === '戦闘狂の眼帯') mult = 1;
        for (const [col, v] of Object.entries(e.raw.e)) {
          const ch = CH[col]; if (!ch) continue;
          let val = resolveValue(v, ov) * mult;
          if (ch === 'origFlat') val *= 100; // ±は実数値(÷100しない)
          if (v.cap != null) val = Math.min(val, v.cap / 100);
          addTo(A, ch, val, rate);
        }
      }
    }
    const man = state.manual;
    if (man) for (const [ch, v0] of Object.entries(man)) {
      const v = +v0; if (!v || !(ch in A)) continue;
      if (MULT.has(ch)) A[ch] *= (1 + v / 100); else if (ch === 'origFlat') A[ch] += v; else A[ch] += v / 100;
    }
    return { A, used };
  }

  // ---- 攻撃一覧 --------------------------------------------------------
  function foodCoef(DATA, value, col) {
    const f = DATA.foodAtk; const ci = f.cols.findIndex(c => c.includes(col));
    if (ci < 0) return null;
    let row = f.rows.find(r => +r[0] === Math.floor(value));
    if (!row) { const lo = f.rows.filter(r => +r[0] <= value); row = lo[lo.length - 1] || f.rows[0]; }
    return +row[ci];
  }

  function buildAttacks(DATA, I, state, di) {
    const m = state.party[di]; const c = DATA.chars[m.char];
    const out = []; if (!c) return out;
    const { set, ranks } = learnedSet(DATA, m);
    const wm = isWM(m);
    const food = c.weapon.food;
    const wname = m.weapon;
    const er = food ? null : pickEquip(DATA, I, wname, set);
    let W = null, ecoef = null;
    if (food) { W = +m.food || 122; }
    else if (er) {
      W = SKILL_FIXED_POWER[wname] || (typeof er.power === 'number' ? er.power : 0);
      const angel = wname === '天使の弓' && set.has(norm('エンジェルアロー'));
      if (wm || angel) W = 118;
      ecoef = (wm || angel) && er.coefWM != null ? er.coefWM : er.coef;
      if (wname === '焙烙玉') {
        const ent = collect(DATA, I, state, di).find(x => x.name === '焙烙玉の武器攻撃力強化');
        const on = ent ? getOv(state, ent, entryDefaults(DATA, state, di, ent)).on : true;
        const base = wm ? 118 : 101;
        if (on) { W = 125; ecoef = 0.3; } else { W = base; ecoef = wm ? 0.23 : 0.2; }
      }
    }
    const thunder = hasSpecial(m, '雷の呼吸'), bomber = hasSpecial(m, '爆弾魔');
    const mk = o => { o.rankNum = o.rankNum || 0; out.push(o); return o; };
    if (!food && er) {
      mk({ id: 'n', label: '通常攻撃', name: '通常攻撃', kind: 'normal', coef: ecoef, W });
      if (set.has(norm('ナイフカウンター'))) mk({ id: 'nc', label: 'ナイフカウンター', name: 'ナイフカウンター', kind: 'normal', coef: ecoef, W, noKami: true });
      if (set.has(norm('カウンターネイル'))) mk({ id: 'cn', label: 'カウンターネイル', name: 'カウンターネイル', kind: 'normal', coef: ecoef, W, noKami: true, pre: 0.5 });
      if (set.has(norm('匠の技'))) mk({ id: 'tk', label: '匠の技', name: '匠の技', kind: 'normal', coef: ecoef, W, noKami: true, post: 30 });
    }
    if (food) for (const col of FOOD_COLS) {
      if (col === '貧乏神' ? m.char !== '貧乏神' : !set.has(norm(col))) continue;
      const cf = foodCoef(DATA, W, col); if (cf == null) continue;
      mk({ id: 'f' + col, label: col + '（食攻撃力）', name: col, kind: 'skill', coef: cf, W });
    }
    // スキル固有係数
    const skillAtk = (sec, name, label, coefObj) => {
      const lst = I.skillCoef[sec + '|' + name] || [];
      lst.forEach((e, k) => {
        let cf = e.coef;
        if (thunder && THUNDER_COEF[name] != null) cf = THUNDER_COEF[name];
        mk({ id: 'sk' + sec + name + k, label: label || name + (e.note && e.note !== 'なし' ? '（' + e.note + '）' : ''), name, kind: 'skill', coef: cf, W: W != null ? W : 0, note: e.note });
      });
    };
    for (const key of Object.keys(I.skillCoef)) {
      const [sec, name] = key.split('|');
      if (sec === 'スキル' && set.has(norm(name))) skillAtk(sec, name);
      if (sec === 'ゆくせさり' && m.yuku && m.yuku.name && (name === m.yuku.name || name === (m.yuku.name + 'のスーツ'))) skillAtk(sec, name);
      if (sec === '装備' && (name === m.weapon || name === m.weapon2)) skillAtk(sec, name);
      if (sec.startsWith('特殊習得') && m.special && Object.values(m.special).includes(name)) skillAtk(sec, name, name + '（エンシェントスキル）');
    }
    // リトルマーメイド
    if (m.char === 'マーメイド') {
      const lm = set.has(norm('攻撃アップLM')) ? 4 : 1;
      const chibi = set.has(norm('召喚精度アップ')) ? 'ちびマーメイドの通常攻撃（召喚係数0.8）' : 'ちびマーメイドの通常攻撃（召喚係数は最大値0.8）';
      const defs = [];
      if (set.has(norm('変異'))) defs.push(['クソデカマーメイドの通常攻撃（召喚係数3）', 3]);
      defs.push([chibi, 0.8]);
      defs.forEach(([lab, k], idx) => mk({ id: 'lm' + idx, label: lab + (lm > 1 ? '・攻撃アップLM' : ''), name: 'リトルマーメイド', kind: 'normal', coef: 1.0, W: 0, little: true, summonCoef: k, lmMult: lm, noKami: true }));
    }
    // 雷神の太鼓
    if (m.yuku && m.yuku.name === '雷神の太鼓') { /* skillCoef/ゆくせさり に含まれる */ }
    // 必殺技
    const pushUlt = (name, rankNum, label, base, variant) => {
      let parts = I.ultCoefByName[name] || [];
      if (parts.some(p => p.sec !== 'スキル')) parts = parts.filter(p => p.sec !== 'スキル');
      let k = 0;
      for (const e of parts) {
        if (e.sec === 'サブ必殺技' && base !== 'sub') continue;
        if (name === '妹にいいとこ見せたるでぇ～') { const strong = variant === '強化状態'; if ((e.note === '強化状態') !== strong) continue; }
        let cf = e.coefByRank ? e.coefByRank['ランク' + ROMAN[rankNum]] : e.coef;
        if (cf == null) continue;
        const cond = (e.note || '').match(/『(.+?)』(発動|習得)時/);
        const active = cond ? set.has(norm(cond[1])) : true;
        let lab = label || name;
        if (name === 'n万アンペア') lab = ['', '1万', '10万', '100万', '1000万'][rankNum] + 'アンペア';
        let ne = e.note && e.note !== 'なし' ? '（' + e.note + '）' : '';
        if (name === '火産ゆ神' && cf === 0.03) ne = '（根元）';
        if (variant === '強化状態') ne = '';
        mk({ id: 'u' + name + k++, label: lab + ne, name, kind: 'ult', isUlt: true, coef: cf, W: W != null ? W : 0, rankNum, plus4: name === 'ソウルスティール', inactive: !active, condNote: cond ? cond[0] : null, sub: base === 'sub' });
      }
    };
    if (m.ult && m.ult.name) {
      const rn = ROMAN.indexOf(m.ult.rank || 'IV'); const ue = c.ults.find(x => x.page === m.ult.name) || {}; const u = ue.coef || m.ult.name;
      pushUlt(u, rn > 0 ? rn : 4, ue.variant === '強化状態' ? '妹にいいとこ見せたるでぇ～（強化状態）' : null, null, ue.variant);
    }
    for (const s of (c.subs || [])) { if ((s in c.fixed || s in c.pool) && !set.has(norm(s))) continue; pushUlt(s, 4, s, 'sub'); }
    // スキル扱いの必殺固有係数(習得スキル名と一致)
    for (const e of (DATA.ultCoef['スキル'] || [])) {
      if (!set.has(norm(e.name)) || e.name === '復活の舞') continue;
      if (out.some(o => o.name === e.name && o.kind === 'ult')) continue;
      mk({ id: 'us' + e.name + e.note, label: e.name + (e.note && e.note !== 'なし' ? '（' + e.note + '）' : ''), name: e.name, kind: 'ult', isUlt: true, coef: e.coef, W: W || 0, rankNum: 4 });
    }
    // ゆくせさり必殺
    if (m.yuku && m.yuku.name) for (const e of (DATA.ultCoef['ゆくせさり'] || [])) {
      if (!e.name.startsWith(m.yuku.name) && !m.yuku.name.startsWith(e.name.replace(/\d+$/, ''))) continue;
      const dg = e.name.match(/(\d)$/);
      if (dg && +dg[1] !== +m.yuku.rank && /セントリーガン/.test(e.name) && !/炸裂/.test(e.name)) continue;
      mk({ id: 'uy' + e.name + e.note, label: e.name + (e.note && e.note !== 'なし' ? '（' + e.note + '）' : ''), name: e.name, kind: 'ult', isUlt: true, coef: e.coef, W: W || 0, rankNum: 4 });
    }
    // 爆弾魔・雷の呼吸 補正フラグ
    for (const a of out) {
      a.extraIso = 1;
      a.kamiUlt = set.has(norm('蒼の奇蹟')) || !!(state.others && state.others.flags && state.others.flags.kiseki) || (m.yuku && m.yuku.name === '例の紐');
      if (bomber && BOMB_ATK.includes(a.name)) a.extraIso *= 3;
      if (thunder && a.kind === 'ult' && THUNDER_ULT.includes(a.name)) a.extraIso *= 1.5;
    }
    return out;
  }

  // ---- ステータス -------------------------------------------------------
  function stats(DATA, I, state, di, aggAll) {
    const m = state.party[di];
    const A = aggAll || aggregate(DATA, I, state, di, null).A;
    let tal = m.tal.slice();
    if (learnedSet(DATA, m).set.has(norm('アマノジャク'))) {
      tal = [(72 / 31) * (31 - tal[0]), 2 * (31 - tal[1]), 2 * (31 - tal[2]), 31 - tal[3]];
    }
    const lv = +m.lv || 1;
    const atk = Math.round(lv * (16 + tal[1]) * 0.1 * (1 + A.origAtk) + A.origFlat);
    return { atk, tal };
  }

  // ---- ダメージ -------------------------------------------------------
  function damage(atkSpec, A, st, g, crit, proc) {
    const achv = 1 + (g.achv || 0);
    const addAtk = Math.max(0, 1 + A.addAtk + (atkSpec.isUlt ? A.uAdd : 0));
    const iso = A.isoAtk;
    const indep = A.indep * (atkSpec.isUlt ? A.uIndep : 1);
    const monQ = +g.yomogi || 0;
    const hasMon = g.mondokoro;
    const kami = g.kami ? (atkSpec.isUlt ? (atkSpec.kamiUlt ? ceil((+g.sortie || 0) / 20) : 0) : ceil((+g.sortie || 0) / 10)) : 0;
    const W = atkSpec.W || 0;
    const mon = hasMon ? (atkSpec.kind === 'normal' ? 15 * monQ : 0.15 * W * monQ) : 0;
    const isoVar = A.isoVar * (atkSpec.extraIso || 1) * (proc ? 50 : 1);
    const addVar = 1 + A.addVar;
    const kusa = 0;
    let x1, x2, x3;
    if (atkSpec.kind === 'normal') {
      x1 = ceil(((100 + st.atk * addAtk * iso * achv) * indep + mon) * (atkSpec.pre || 1) * atkSpec.coef * A.coefBuf);
      x2 = ceil((x1 + (atkSpec.noKami ? 0 : kami)) * (atkSpec.post || 1) * addVar * isoVar * crit);
      return x2 + kusa;
    }
    if (atkSpec.kind === 'skill') {
      x1 = ceil(W * (1 + 0.01 * st.atk * addAtk * iso * achv) * indep + mon);
      x2 = ceil(x1 * atkSpec.coef * A.coefBuf);
      return ceil(x2 * addVar * isoVar * crit) + kusa;
    }
    x1 = ceil(W * (1 + 0.01 * st.atk * addAtk * iso * achv) * indep + mon);
    x2 = ceil(x1 * atkSpec.coef * A.coefBuf + (atkSpec.plus4 ? 4 : 0) + kami);
    return ceil(x2 * addVar * isoVar * crit) + kusa;
  }

  const OJI = { 'サキュバス': { atk: 23, coef: 1, ult: 'ハートブレイクアロー' }, 'フェニックス': { atk: 31, coef: 0.4, ult: '復活の舞' }, 'ダークナイト': { atk: 28, coef: 1, ult: 'ダークスラッシュ' }, 'マーメイド': { atk: 26, coef: 1, ult: null } };
  function m_weapon(state, di) { return state.party[di].weapon; }

  function evaluate(DATA, I, state, di) {
    const g = state.global || {};
    const dealer = state.party[di];
    const attacks = buildAttacks(DATA, I, state, di);
    const aggBase = aggregate(DATA, I, state, di, null);
    const st = stats(DATA, I, state, di, aggBase.A);
    const waki = dealer.yuku && dealer.yuku.name === '脇差・子狐丸';
    const cov = state.coefOv || {};
    const ovc = (id, c0) => { const v = cov[id]; return (v !== undefined && v !== null && v !== '' && isFinite(+v)) ? +v : c0; };
    const rows = attacks.map(a => {
      a.coef0 = a.coef; a.coef = ovc(a.id, a.coef);
      const { A } = aggregate(DATA, I, state, di, a, a.little ? { little: true, star: 1 } : null);
      if (a.little && m_weapon(state, di) === '騎士の槍') { A.critRate += 0.02; A.critMult += 1.0; }
      const st2 = a.little ? { atk: Math.floor(st.atk * a.summonCoef * a.lmMult), tal: st.tal } : st;
      const R = Math.min(1, Math.max(0, A.critRate + (a.isUlt ? A.uCritRate : 0)));
      const M = Math.max(0, A.critMult + (a.isUlt ? A.uCritMult : 0));
      const normal = damage(a, A, st2, g, 1, false);
      const crit = damage(a, A, st2, g, 1 + M, false);
      let expect = damage(a, A, st2, g, 1 + R * M, false);
      let critProc = null;
      if (waki) {
        critProc = damage(a, A, st2, g, 1 + M, true);
        const p = g.wakiRate == null ? 0.01 : g.wakiRate;
        expect = Math.round((1 - R) * normal + R * ((1 - p) * crit + p * critProc));
      }
      return { id: a.id, label: a.label, kind: a.kind, normal, crit, expect, critProc, R, M, inactive: !!a.inactive, condNote: a.condNote, coef: a.coef, coef0: a.coef0, W: a.W, add: A.addAtk + (a.isUlt ? A.uAdd : 0), atkUsed: st2.atk, little: !!a.little };
    });
    // 壁役おじさん(魔王妹のみ)
    if (dealer.char === '魔王妹' && state.ojisan && learnedSet(DATA, dealer).set.has(norm('壁役おじさん召喚'))) {
      const g2 = Object.assign({}, g, { mondokoro: false, kami: false });
      const lv = +dealer.lv || 1;
      for (const nm of Object.keys(OJI)) {
        if (!state.ojisan[nm]) continue;
        const o = OJI[nm]; const atkv = Math.round(lv * (16 + o.atk) * 0.1);
        const specs = [{ label: '通常攻撃', name: '通常攻撃', kind: 'normal', coef: o.coef, W: 115, noKami: true }];
        if (nm === 'マーメイド') specs.push({ label: 'ちびマーメイドの通常攻撃（召喚係数0.8）', name: 'リトルマーメイド', kind: 'normal', coef: 1, W: 0, noKami: true, little: true, atkv: Math.floor(atkv * 0.8) });
        if (o.ult) (I.ultCoefByName[o.ult] || []).filter(p => p.sec === '必殺技').forEach(p => {
          const cf = p.coefByRank ? p.coefByRank['ランクIV'] : p.coef; if (cf == null) return;
          const lab = o.ult + (p.note && p.note !== 'なし' ? '（' + p.note + '）' : ''); if (specs.some(x => x.label === lab)) return;
          specs.push({ label: lab, name: o.ult, kind: 'ult', isUlt: true, coef: cf, W: 115, rankNum: 4, extraIso: 1 });
        });
        for (const a of specs) {
          a.rankNum = a.rankNum || 0; a.extraIso = a.extraIso || 1;
          a.coef0 = a.coef; a.coef = ovc('oji' + nm + a.label, a.coef);
          const { A } = aggregate(DATA, I, state, di, a, { little: true, star: 1 });
          const stx = { atk: a.atkv != null ? a.atkv : atkv, tal: [0, 0, 0, 0] };
          const R = Math.min(1, Math.max(0, A.critRate + (a.isUlt ? A.uCritRate : 0)));
          const M = Math.max(0, A.critMult + (a.isUlt ? A.uCritMult : 0));

  // ---------- 検索できるプルダウン ----------
  const nz = s => String(s).normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  let pop = null;
  function closePop() { if (pop) { pop.remove(); pop = null; } }
  function openPop(sel, btn) {
    closePop();
    const items = [];
    for (const ch of sel.children) {
      if (ch.tagName === 'OPTGROUP') { items.push({ head: ch.label }); for (const o of ch.children) items.push({ v: o.value, t: o.textContent, g: ch.label }); }
      else items.push({ v: ch.value, t: ch.textContent });
    }
    pop = document.createElement('div'); pop.className = 'pop';
    const r = btn.getBoundingClientRect();
    pop.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 260)) + 'px';
    const below = window.innerHeight - r.bottom;
    if (below > 260 || below > r.top) { pop.style.top = r.bottom + 2 + 'px'; pop.style.maxHeight = Math.max(160, below - 12) + 'px'; }
    else { pop.style.bottom = window.innerHeight - r.top + 2 + 'px'; pop.style.maxHeight = Math.max(160, r.top - 12) + 'px'; }
    pop.style.minWidth = Math.max(200, r.width) + 'px';
    const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = '文字を入力して検索'; pop.appendChild(inp);
    const list = document.createElement('div'); list.className = 'plist'; pop.appendChild(list);
    let hi = 0, shown = [];
    const draw = () => {
      const q = nz(inp.value.trim()); list.innerHTML = ''; shown = [];
      let lastHead = null;
      items.forEach((it, idx) => {
        if (it.head !== undefined) { lastHead = it; return; }
        if (q && !nz(it.t).includes(q) && !(it.g && nz(it.g).includes(q))) return;
        if (lastHead && lastHead.g !== false) { const h = document.createElement('div'); h.className = 'phead'; h.textContent = lastHead.head; list.appendChild(h); lastHead.g = false; }
        const d = document.createElement('div'); d.className = 'pitem' + (it.v === sel.value ? ' cur' : ''); d.textContent = it.t;
        d.addEventListener('mousedown', ev => { ev.preventDefault(); pick(it); });
        list.appendChild(d); shown.push({ it, d });
      });
      items.forEach(it => { if (it.head !== undefined) delete it.g; });
      hi = Math.max(0, shown.findIndex(s => s.it.v === sel.value && !q)); mark();
    };
    const mark = () => { shown.forEach((s, i) => s.d.classList.toggle('hi', i === hi)); const s = shown[hi]; if (s) s.d.scrollIntoView({ block: 'nearest' }); };
    const pick = it => { closePop(); if (sel.value !== it.v) { sel.value = it.v; sel.dispatchEvent(new Event('change', { bubbles: true })); } };
    inp.addEventListener('input', () => { hi = 0; draw(); if (nz(inp.value.trim())) { hi = 0; mark(); } });
    inp.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowDown') { hi = Math.min(shown.length - 1, hi + 1); mark(); ev.preventDefault(); }
      else if (ev.key === 'ArrowUp') { hi = Math.max(0, hi - 1); mark(); ev.preventDefault(); }
      else if (ev.key === 'Enter') { if (!ev.isComposing && shown[hi]) pick(shown[hi].it); ev.preventDefault(); }
      else if (ev.key === 'Escape') closePop();
    });
    document.body.appendChild(pop); draw(); inp.focus();
  }
  function enhance() {
    closePop();
    document.querySelectorAll('#app select').forEach(sel => {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'cb';
      const cur = sel.options[sel.selectedIndex];
      btn.textContent = cur ? cur.textContent : '';
      btn.addEventListener('click', ev => { ev.preventDefault(); openPop(sel, btn); });
      sel.style.display = 'none'; sel.parentNode.insertBefore(btn, sel);
    });
  }
  document.addEventListener('mousedown', ev => { if (pop && !pop.contains(ev.target) && !(ev.target.classList && ev.target.classList.contains('cb'))) closePop(); });

  function render() {
    const dealer = state.party[0];
    const g = state.global;
    g.kami = !!(dealer.weapon === 'かみさまのナイフ');
    g.mondokoro = !!(dealer.yuku && dealer.yuku.name === 'もんどころ');
    let res = null;
    if (dealer.char) try { res = E.evaluate(DATA, I, evState(), 0); } catch (err) { console.error(err); }
    let h = '', bh = '';
    h += `<section><h2>ダメージを出すキャラ <button class="btn sm" data-a="reset" data-w="dealer">リセット</button></h2>` + dealerCard(dealer) + '</section>';
    h += `<section><h2>他者から受けるバフ <button class="btn sm" data-a="reset" data-w="oall">リセット</button></h2>` + othersPanel(dealer) + '</section>';
    const L0 = h; h = '<section><h2>与ダメージ</h2>';
    if (!res) h += '<p class="muted">' + (dealer.char ? '計算できませんでした。' : 'ダメージを出すキャラを選択してください。') + '</p>';
    else {
      const waki = dealer.yuku && dealer.yuku.name === '脇差・子狐丸';
      h += `<p><b>${esc(dealer.char)}</b>　攻撃力 <b>${fmt(res.stats.atk)}</b>${E.isWM(dealer) ? '　<span class="tag">ウェポンマスター: 武器攻撃力118</span>' : ''}</p>
        <div class="tw"><table class="res"><thead><tr><th>攻撃</th><th>通常</th><th>クリティカル</th><th>期待値</th>${waki ? '<th>子狐丸クリ</th>' : ''}</tr></thead><tbody>` +
        res.rows.map(r => `<tr class="${r.inactive ? 'off' : ''}"><td><label class="chk"><input type="checkbox" data-a="rowsel" data-id="${esc(r.id)}"${unchecked.has(r.id) ? '' : ' checked'}> ${esc(r.label)}</label>${r.inactive ? `<div class="note">条件未成立: ${esc(r.condNote)}</div>` : ''}<div class="note">${r.little ? '攻撃力' + fmt(r.atkUsed) + ' / ' : ''}係数${r.coef} / 加算バフ+${Math.round(r.add * 1000) / 10}% / クリ率${(r.R * 100).toFixed(1)}% 倍率+${(r.M * 100).toFixed(0)}%</div></td><td>${fmt(r.normal)}</td><td>${fmt(r.crit)}</td><td>${fmt(r.expect)}</td>${waki ? `<td>${fmt(r.critProc)}</td>` : ''}</tr>`).join('') + '</tbody></table></div>';
      h += '<p><button data-a="savedmg" class="btn">この与ダメージを保存</button> <button data-a="imgnow" class="btn">画像にする</button></p>';
      if (!res.rows.length) h += '<p class="muted">計算できる攻撃がありません（武器・必殺技・スキルを選んでください）。</p>';
      bh = '<section><h2>適用中のバフ</h2><p class="muted">チェックで有効/無効、発動具合(0〜1)を変更できます。条件つきのスキル（逆境・HP条件・同族嫌悪など）はここで調整してください。</p>' + buffPanel(res) + '</section>';
    }
    h += '</section>';
    h += savesPanel(res);
    const R0 = h; h = '';
    h += `<section><h2>全体設定</h2><div class="grid">
      <label>攻撃実績バフ(%) <input type="number" min="0" max="10" step="0.5" value="${(g.achv * 100)}" data-a="g" data-f="achv"> <span class="muted">最大10（=110%）。ゆっくり対戦では0</span></label>
</div><p class="muted">この設定は「入力を初期化」でも変わりません。</p></section>`;
    h += manualPanel(res);
    const sy = window.scrollY;
    $('#app').innerHTML = `<div class="cols"><div class="left">${L0}${bh}${h}</div><div class="right">${R0}</div></div>`;
    window.scrollTo(0, sy);
    enhance();
    save();
  }

  // ---------- イベント ----------
  function onChange(ev) {
    const t = ev.target; const a = t.dataset.a; if (!a) return;
    const i = 0; const m = state.party[0]; const o = state.others;
    let val = t.type === 'checkbox' ? t.checked : t.value;
    if (t.type === 'number' && val !== '') {
      let v = +val; if (t.min !== '' && v < +t.min) v = +t.min; if (t.max !== '' && v > +t.max) v = +t.max;
      if (v !== +val) t.value = v; val = String(v);
    }
    if (a === 'sname') { const s = saves.find(x => x.id === +t.dataset.id); if (s) s.name = val || s.name; return; }
    switch (a) {
      case 'char': if (val) { state.party[0] = newMember(val, 1); state.ov = Object.fromEntries(Object.entries(state.ov).filter(([k]) => !k.startsWith('0|'))); } break;
      case 'set': {
        const f = t.dataset.f;
        if (/^tal\d$/.test(f)) m.tal[+f[3]] = +val;
        else if (f === 'weapon') m.weapon = val;
        else m[f] = +val;
        break;
      }
      case 'skill': {
        const n = t.dataset.n; m.skills = m.skills || {};
        m.skills[n] = val ? true : undefined;
        if (!weaponOptions(m).some(e => e.name === m.weapon)) m.weapon = defaultWeapon(m);
        break;
      }
      case 'skillrank': {
        const n = t.dataset.n, r = t.dataset.r; m.skills = m.skills || {};
        let arr = Array.isArray(m.skills[n]) ? m.skills[n].slice() : [];
        arr = arr.filter(x => x !== r); if (t.checked) arr.push(r);
        m.skills[n] = arr.length ? arr : undefined; break;
      }
      case 'spec': m.special = m.special || {}; m.special[t.dataset.cat] = val || undefined; break;
      case 'glory': m.glory = !!val; break;
      case 'yuku': m.yuku = val ? { name: val, rank: [...(yukuNames[val] || [])].sort((a, b) => +a - +b).pop() || 1 } : null; break;
      case 'yukurank': m.yuku.rank = val; break;
      case 'ult': m.ult = val ? { name: val, rank: 'IV' } : null; break;
      case 'ultrank': if (m.ult) m.ult.rank = val; break;
      case 'rowsel': if (val) unchecked.delete(t.dataset.id); else unchecked.add(t.dataset.id); break;
      case 'coefov': if (val === '' || !isFinite(+val)) delete state.coefOv[t.dataset.id]; else state.coefOv[t.dataset.id] = +val; break;
      case 'man': state.manual[t.dataset.f] = val === '' ? 0 : +val; break;
      case 'ofl': o.flags[t.dataset.f] = !!val; break;
      case 'ojisan': state.ojisan[t.dataset.n] = !!val; break;
      case 'oult': {
        const k = +t.dataset.k;
        if (!val) { if (k < o.ults.length) o.ults.splice(k, 1); }
        else { const ub = DATA.ultBuff[val]; const rks = ub.byStar ? [] : Object.keys(ub.ranks); o.ults[k] = { name: val, rank: rks.includes('IV') ? 'IV' : (rks[rks.length - 1] || 'IV') }; }
        break;
      }
      case 'oultrank': { const u = o.ults[+t.dataset.k]; if (u) u.rank = val; break; }
      case 'oskill': o.skills[t.dataset.n] = val ? true : undefined; break;
      case 'oskillrank': {
        const n = t.dataset.n, r = t.dataset.r;
        let arr = Array.isArray(o.skills[n]) ? o.skills[n].slice() : [];
        arr = arr.filter(x => x !== r); if (t.checked) arr.push(r);
        o.skills[n] = arr.length ? arr : undefined; break;
      }
      case 'oflag': o[t.dataset.f] = !!val; break;
      case 'oherdn': o.herdN = Math.max(1, Math.min(8, +val || 1)); break;
      case 'g': { const f = t.dataset.f; state.global[f] = (f === 'achv' || f === 'wakiRate') ? (+val) / 100 : +val; break; }
      case 'ov': {
        const k = t.dataset.k; const f = t.dataset.f; state.ov[k] = state.ov[k] || {};
        state.ov[k][f] = f === 'on' ? !!val : (f === 'scope' ? val : +val); break;
      }
    }
    render();
  }
  document.addEventListener('change', onChange);
  document.addEventListener('toggle', ev => { const d = ev.target; if (d.dataset && d.dataset.low) lowOpen = d.open; }, true);
  document.addEventListener('click', ev => {
    const t = ev.target.closest('button[data-a]'); if (!t) return; const a = t.dataset.a;
    if (a === 'savedmg') {
      let res; try { res = E.evaluate(DATA, I, evState(), 0); } catch (e) { return; }
      saveSeq++; saves.push({ id: saveSeq, name: 'データ' + saveSeq, rows: res.rows.filter(r => !r.inactive && !unchecked.has(r.id)).map(r => ({ label: r.label, normal: r.normal, crit: r.crit, expect: r.expect, critProc: state.party[0].yuku && state.party[0].yuku.name === '脇差・子狐丸' ? r.critProc : null })), info: imgInfo(res), waki: !!(state.party[0].yuku && state.party[0].yuku.name === '脇差・子狐丸'), snap: clone({ party: state.party, others: state.others, ov: state.ov, global: state.global, manual: state.manual, coefOv: state.coefOv, ojisan: state.ojisan }) });
      render();
    } else if (a === 'reset') {
      if (!confirm('リセットしますか？')) return;
      const w = t.dataset.w, m = state.party[0], o = state.others;
      const dropOv = f => { state.ov = Object.fromEntries(Object.entries(state.ov).filter(([k]) => !f(k))); };
      const dflt = () => { o.spear = false; o.wing = false; o.general = false; o.glory = false; o.herd = true; o.herdN = 4; };
      if (w === 'dealer') { state.party[0] = emptyMember(); state.ojisan = {}; dropOv(k => k.startsWith('0|')); }
      else if (w === 'dskill') { m.skills = {}; if (m.char && !weaponOptions(m).some(e => e.name === m.weapon)) m.weapon = defaultWeapon(m); }
      else if (w === 'dspec') { m.special = {}; m.glory = false; }
      else if (w === 'oall') { o.ults = []; o.skills = {}; o.flags = {}; dflt(); dropOv(k => !k.startsWith('0|')); }
      else if (w === 'oult') o.ults = [];
      else if (w === 'oskill') { for (const n of ['鼓舞', 'カリスマ', 'アタックフィールド', 'クリティカルフィールド', 'みんな違ってみんないい', 'デバフ要員']) delete o.skills[n]; o.wing = false; o.glory = false; o.herd = true; o.herdN = 4; }
      else if (w === 'olow') { for (const n of ['嫌われ者', 'すばらしいこの世界への祝福', 'エレキフィールド', '剣帝陣', '同調圧力']) delete o.skills[n]; o.general = false; o.spear = false; o.flags = {}; }
      else if (w === 'oyuku') dflt();
      else if (w === 'oflags') o.flags = {};
      else if (w === 'manual') state.manual = {};
      else if (w === 'coefov') state.coefOv = {};
      render();
    } else if (a === 'del') { saves = saves.filter(x => x.id !== +t.dataset.id); render(); }
    else if (a === 'delall') { saves = []; render(); }
    else if (a === 'restore') { const s = saves.find(x => x.id === +t.dataset.id); if (s) { const c = clone(s.snap); state.party = c.party; state.others = c.others; state.ov = c.ov; state.global = c.global; state.manual = c.manual || {}; state.coefOv = c.coefOv || {}; state.ojisan = c.ojisan || {}; render(); } }
    else if (a === 'imgsave') { const s = saves.find(x => x.id === +t.dataset.id); if (s) showImage(makeImage(s.name, s.info, s.rows, s.waki), 'yukuiku-' + s.name + '.png'); }
    else if (a === 'imgnow') { let res; try { res = E.evaluate(DATA, I, evState(), 0); } catch (e) { return; } const w = !!(state.party[0].yuku && state.party[0].yuku.name === '脇差・子狐丸'); showImage(makeImage('与ダメージ', imgInfo(res), res.rows.filter(r => !r.inactive && !unchecked.has(r.id)), w), 'yukuiku-damage.png'); }
  });
  $('#reset').addEventListener('click', () => { if (confirm('入力内容を初期化しますか？')) { initState(); render(); } });
  render();
})();
</script>
</body>
</html>
